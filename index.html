<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Bestpad</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <script>
    try {
      const stored = localStorage.getItem('notepad:theme');
      const previous = { grey: 'ruled', light: 'plain', midnight: 'dot', forest: 'ruled', sepia: 'legal' };
      const theme = stored === 'graph' ? 'ruled' : previous[stored] || stored;
      document.documentElement.dataset.theme = ['ruled', 'plain', 'legal', 'dot', 'darkpad'].includes(theme) ? theme : 'ruled';
      const font = localStorage.getItem('notepad:font');
      if (['mono', 'sans', 'serif', 'rounded'].includes(font)) document.documentElement.dataset.font = font;
      const size = localStorage.getItem('notepad:text-size');
      if (['small', 'medium', 'large'].includes(size)) document.documentElement.dataset.textSize = size;
    } catch { /* Use defaults when storage is unavailable. */ }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.core.css">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" defer></script>
  <script src="/settings.js" defer></script>
  <script src="/auth.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main id="notepad" class="notepad">
    <header class="page-header"><img class="header-logo" src="/logo.png" alt="Bestpad" width="2172" height="724"><div id="heading-toolbar" class="header-add" role="group" aria-label="Note tools" hidden>
      <button id="open-add" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="add-menu">Tools</button>
      <div id="add-menu" class="add-menu" role="menu" aria-label="Note tools" hidden>
        <button type="button" role="menuitem" data-insert="heading">Heading</button>
        <button type="button" role="menuitem" data-insert="time">Current time</button>
        <button type="button" role="menuitem" data-insert="date">Current date</button>
      </div>
    </div><button id="open-settings" type="button" aria-haspopup="dialog">Settings</button><button id="open-login" type="button">Login</button></header>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="dialog-heading"><h2 id="settings-title">Settings</h2><button id="close-settings" class="close-dialog" type="button" aria-label="Close settings">×</button></div>
      <fieldset class="theme-options"><legend>Theme</legend>
        <label class="theme-option"><input type="radio" name="theme" value="ruled"><span class="theme-swatch swatch-ruled" aria-hidden="true"></span><span><strong>Cream</strong><small>Soft cream with cool grey accents</small></span></label>
        <label class="theme-option"><input type="radio" name="theme" value="legal"><span class="theme-swatch swatch-legal" aria-hidden="true"></span><span><strong>Yellow</strong><small>Warm yellow with golden accents</small></span></label>
        <label class="theme-option"><input type="radio" name="theme" value="dot"><span class="theme-swatch swatch-dot" aria-hidden="true"></span><span><strong>Sand</strong><small>Ivory with warm neutral accents</small></span></label>
        <label class="theme-option"><input type="radio" name="theme" value="plain"><span class="theme-swatch swatch-plain" aria-hidden="true"></span><span><strong>White</strong><small>Clean white with neutral grey accents</small></span></label>
        <label class="theme-option"><input type="radio" name="theme" value="darkpad"><span class="theme-swatch swatch-darkpad" aria-hidden="true"></span><span><strong>Darkpad</strong><small>Blue-black with cool blue accents</small></span></label>
      </fieldset>
      <div class="font-setting">
        <fieldset id="note-font" class="font-options"><legend>Note font</legend>
          <label class="font-choice"><input type="radio" name="note-font" value="mono"><span class="font-mono">Typewriter · Monospace</span></label>
          <label class="font-choice"><input type="radio" name="note-font" value="sans"><span class="font-sans">Clean · Sans serif</span></label>
          <label class="font-choice"><input type="radio" name="note-font" value="serif"><span class="font-serif">Book · Serif</span></label>
          <label class="font-choice"><input type="radio" name="note-font" value="rounded"><span class="font-rounded">Rounded · Friendly</span></label>
        </fieldset>
        <label for="note-size">Text size</label>
        <select id="note-size">
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
        </select>
        <p id="size-status" role="status">Your text size is saved on this device.</p>
        <p id="font-preview" aria-hidden="true">The quick brown fox jumps over the lazy dog.</p>
        <p id="font-status" role="status">Your font is saved on this device.</p>
      </div>
      <p id="theme-status" role="status">Your theme is saved on this device.</p>
    </dialog>
    <dialog id="login-dialog" aria-labelledby="login-title">
      <div class="dialog-heading"><h2 id="login-title">Login</h2><button id="close-login" type="button" aria-label="Close login">×</button></div>
      <form id="auth-form" aria-label="Sign in" hidden>
        <label>Email<input id="auth-email" type="email" autocomplete="username" required></label>
        <label>Password<input id="auth-password" type="password" autocomplete="current-password" required></label>
        <button id="sign-in" type="submit">Sign in</button>
        <button id="sign-up" type="submit">Create account</button>
      </form>
      <div id="account-session" hidden><span id="account-email"></span><button id="sign-out" type="button">Sign out</button></div>
      <p id="auth-status" role="status" aria-live="polite">Connecting to your account…</p>
    </dialog>
    <div class="tabbar"><div id="tabs" role="tablist" aria-label="Notes"></div><button id="add-tab" aria-label="New tab" title="New tab">+</button></div>
    <div id="rich-editor" class="rich-host" hidden></div>
    <label class="sr-only" for="editor">Note text</label>
    <textarea id="editor" spellcheck="false" wrap="soft" placeholder="" aria-describedby="save-status"></textarea>
    <footer><span id="save-status" role="status">Saved locally</span><span id="position">Ln 1, Col 1</span><span id="count">0 characters</span><span>UTF-8</span></footer>
  </main>
</body>
</html>
